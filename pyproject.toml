[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-agent-benchmarking"
version = "0.6"
description="A Python library for benchmarking Weaviate's Query Agent!"
readme="README.md"
requires-python = ">=3.11"
dependencies = [
  "dspy>=3.2.0",
  "sentence-transformers>=5.0.0",
  "weaviate-client>=4.19.2",
  "weaviate-agents>=1.1.0",
  "pandas>=2.3.1",
  "datasets>=4.0.0",
  "ir-datasets>=0.5.11",
  "pip>=25.2",
  "setuptools>=80.9.0",
  "wheel>=0.45.1",
  "twine>=6.2.0",
  "PyMuPDF>=1.24.0",
  "weaviate-engram>=0.5.0",
  "python-dotenv>=1.1.1",
  "fastapi>=0.135.3",
  "uvicorn>=0.44.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["query_agent_benchmarking*"]
exclude = ["notebooks*", "results*", "locust*", "ci*"]

[tool.pytest.ini_options]
# By default only run unit/integration tests (fast, no network).
# Functional tests download real data — opt in explicitly:
#   uv run pytest tests/functional/ -v
testpaths = ["tests"]
addopts = "--ignore=tests/functional"
filterwarnings = [
    "ignore:The 'prefix' argument:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
