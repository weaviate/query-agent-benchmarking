# =============================================================================
# Search Mode Settings
# =============================================================================
search_agent_name: "hybrid-search"
search_dataset: longmemeval-m

# See `named_vectors.md` for supported target vectors.
search_target: "text_content_weaviate"

# =============================================================================
# Ask Mode Settings
# =============================================================================
ask_agent_name: "query-agent-ask"
ask_dataset: multihoprag
queries: "multihoprag"

# LLM Judge configuration
judge_model: "openai/gpt-4.1"
ensemble_k: 3

# =============================================================================
# Shared Settings
# =============================================================================
use_async: True
max_concurrent: 5
sleep_between_requests: 0

use_subset: False
num_samples: 100

num_trials: 1
batch_size: 5

agents_host: https://api.agents.weaviate.io
external_service_host: http://localhost:8000/search

# =============================================================================
# Embedding Model Comparison
# =============================================================================
ablate_embedding_models: 
- "weaviate/Snowflake/snowflake-arctic-embed-l-v2.0"
- "weaviate/Snowflake/snowflake-arctic-embed-m-v1.5"
