# =============================================================================
# Search Mode Settings
# =============================================================================
search_agent_name: "external_service"
dataset: freshstack-langchain

embedding_model: "weaviate/Snowflake/snowflake-arctic-embed-l-v2.0"

# =============================================================================
# Ask Mode Settings
# =============================================================================
ask_agent_name: "query-agent-ask"
dataset: multihoprag
queries: "multihoprag"

# LLM Judge configuration
judge_model: "openai/gpt-4.1"
ensemble_k: 3

# =============================================================================
# Shared Settings
# =============================================================================
use_async: True
max_concurrent: 5
sleep_between_requests: 0

use_subset: True
num_samples: 50

num_trials: 1
batch_size: 5

agents_host: https://api.agents.weaviate.io
external_service_host: http://localhost:8000/search

# =============================================================================
# Embedding Model Comparison
# =============================================================================
ablate_embedding_models: 
- "Snowflake/snowflake-arctic-embed-l-v2.0"
- "Snowflake/snowflake-arctic-embed-m-v1.5"
