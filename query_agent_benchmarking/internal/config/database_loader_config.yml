dataset_name: query-agent-gym
# QueryAgentGym is one dataset: `query-agent-gym` loads all five environments
# (public-transit, tattoo-studios, nonprofits, surf-schools, childcare), each
# creating one collection per collection in its own schema.json. A single
# environment can be loaded alone as e.g. `query-agent-gym/surf-schools`.
# Every query set (`query-agent-gym/ask-mode`, `/search-mode`, `/edge-case-1`)
# runs against these same collections.

# Multiple datasets — used by populate_db_multi
dataset_names:
  - bright/biology
  - bright/earth_science
  - bright/economics
  - bright/psychology
  - bright/robotics

# Target database: "weaviate" (default) or "engram"
database_target: weaviate

# NOTE: This is a work in progess, need a better abstraction for multiple models from the same provider.
# The problem is X_weaviate_snowflake_... ends up being really verbose when you need to
# reference it in the benchmark config.

# Use a list to create multiple provider-qualified text vectors, e.g.
# `text_content_weaviate`, `text_content_cohere`.
text_embedding_model: "weaviate/Snowflake/snowflake-arctic-embed-l-v2.0"

# Only needed for image datasets (irpapers, officeqa, vidore); requires COHERE_API_KEY.
# image_embedding_model: "cohere/embed-v5.0-pro"

# MUVERA+HNSW parameters
use_MUVERA_encoding: False
ksim: 4
dprojections: 16
repetitions: 10
ef: 500

# LongMemEval subset selection
# Filter tenants (users) by sorted index range. Only sessions for tenants
# within [lower_bound, upper_bound) are loaded/ingested.
# Example: users_to_test: [20, 50] loads tenants at sorted indices 20..49.
longmemeval_subset:
  users_to_test: [0, 20]
