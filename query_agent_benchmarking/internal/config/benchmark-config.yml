# =============================================================================
# Search Mode Settings
# =============================================================================
search_agent_name: "query-agent-search-mode"

# Single dataset — used by run-search-benchmark.py.
# irpapers-text-only queries the IRPapersTextOnly_Default collection
# (transcription text only, no image vectors).
search_dataset: obliq-bench-congress

# Multiple datasets — used by run_search_evals (scripts/run-search-benchmark-multi.py).
# Same "list in config" idea as `dataset_names` in database_loader_config.yml.
search_datasets:
  - irpapers-text-only
#  - bright/earth_science
#  - bright/economics
#  - bright/psychology
#  - bright/robotics

# Sweep search-mode compute effort across "low", "medium", and "high" and print
# a side-by-side comparison instead of a single run. Applies to both
# run-search-benchmark.py and run-search-benchmark-multi.py. Set to false for a
# single run at the `effort` configured in agent-config.yml.
effort_sweep: false

# Baseline agents to include in the effort sweep as reference points. Each runs
# once per sweep (same trials/queries) and appears alongside low/medium/high in
# the comparison. Supports "hybrid-search".
effort_sweep_baselines:
  - hybrid-search

# Per-run config overrides applied during the effort sweep. Keys are effort
# levels ("low"/"medium"/"high") or baseline agent names (e.g. "hybrid-search");
# values override the shared settings (e.g. max_concurrent,
# sleep_between_requests) for that run only. Runs without an entry use the
# shared settings below.
effort_sweep_overrides:
  hybrid-search: {max_concurrent: 5, sleep_between_requests: 0}
  low: {max_concurrent: 5, sleep_between_requests: 0}
  medium: {max_concurrent: 2, sleep_between_requests: 2}
  high: {max_concurrent: 2, sleep_between_requests: 2}

# See `named_vectors.md` for supported target vectors. Only applies to datasets
# with named vectors (e.g. multimodal `irpapers`); ignored for datasets with a
# single unnamed vector like `irpapers-text-only` and BRIGHT.
search_target: "text_content_weaviate"

# =============================================================================
# Ask Mode Settings
# =============================================================================
ask_agent_name: "engram"
queries: "longmemeval-s"

# LLM Judge configuration
judge_model: "openai/gpt-5.4"
ensemble_k: 3
use_reasoning: True

# LongMemEval subset — must match the range ingested via database_loader
longmemeval_subset:
  users_to_test: [0, 20]

# =============================================================================
# Shared Settings
# =============================================================================
external_providers:
#  - voyageai

use_async: True
# Turn down (e.g. max_concurrent: 2, sleep_between_requests: 2) for BRIGHT
# robotics: large documents push embedding traffic toward Voyage's 4M
# tokens/minute rate limit.
max_concurrent: 5
sleep_between_requests: 0

# Safeguard: truncate search query text longer than this many tokens
# (approximated at ~4 chars/token — no tokenizer dependency) before sending to
# the agent. BRIGHT queries can be very long. Unset or 0 disables truncation.
max_query_tokens: 200

use_subset: False
num_samples: 100

num_trials: 1
batch_size: 5

# =============================================================================
# Extra Metrics (appended to the dataset's default metric set)
# =============================================================================
# Each entry needs a "name" (recall, nDCG, success, coverage, alpha_ndcg)
# and a "params" dict (usually just "k").
# Example:
extra_metrics:
   - name: recall
     params: {k: 50}
   - name: recall
     params: {k: 100}

# =============================================================================
# Embedding Model Comparison
# =============================================================================
ablate_embedding_models: 
- "weaviate/Snowflake/snowflake-arctic-embed-l-v2.0"
- "weaviate/Snowflake/snowflake-arctic-embed-m-v1.5"
