name: Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run unit and integration tests
        run: uv run pytest tests/ -v
